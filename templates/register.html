<!DOCTYPE html>
<html>
<head><title>Регистрация</title></head>
<body style="font-family: sans-serif; max-width: 400px; margin: 50px auto;">
    <h2>Регистрация</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Придумайте имя" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
        <input type="password" name="password" placeholder="Придумайте пароль" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
        <button type="submit" style="padding: 10px 20px;">Создать аккаунт</button>
    </form>
    <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
</body>
</html>
