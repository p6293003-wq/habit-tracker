<!DOCTYPE html>
<html>
<head><title>Вход</title></head>
<body style="font-family: sans-serif; max-width: 400px; margin: 50px auto;">
    <h2>Вход в трекер</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Имя" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
        <input type="password" name="password" placeholder="Пароль" required style="width: 100%; padding: 8px; margin-bottom: 10px;"><br>
        <button type="submit" style="padding: 10px 20px;">Войти</button>
    </form>
    <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
</body>
</html>
